[project]
name = "video-factory"
version = "0.1.0"
description = "Cloud Video & Audio Rendering Factory for AI Distribution OS"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
