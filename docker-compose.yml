version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: distribution-os-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-distribution_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-distribution_password}
      POSTGRES_DB: ${POSTGRES_DB:-distribution_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/packages/db:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-distribution_user} -d ${POSTGRES_DB:-distribution_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: distribution-os-valkey
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: distribution-os-core-api
    ports:
      - "8080:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-distribution_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-distribution_password}
      - POSTGRES_DB=${POSTGRES_DB:-distribution_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-distribution_user}:${POSTGRES_PASSWORD:-distribution_password}@postgres:5432/${POSTGRES_DB:-distribution_db}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FAL_KEY=${FAL_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  creator-web:
    build:
      context: ./src/apps/creator-web
      dockerfile: Dockerfile
    container_name: distribution-os-creator-web
    ports:
      - "3000:3000"
    restart: unless-stopped

  admin-web:
    build:
      context: ./src/apps/admin-web
      dockerfile: Dockerfile
    container_name: distribution-os-admin-web
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
