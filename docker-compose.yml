version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: distribution-os-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-distribution_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-distribution_password}
      POSTGRES_DB: ${POSTGRES_DB:-distribution_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/packages/db:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-distribution_user} -d ${POSTGRES_DB:-distribution_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: distribution-os-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  valkey_data:
